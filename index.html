<style>
:root {
  --bg:        #f2ede6;
  --bg2:       #ede7de;
  --card:      #faf8f5;
  --card2:     #f4efe8;
  --ink:       #1c1a17;
  --ink2:      #5a5549;
  --ink3:      #9a9287;
  --accent:    #2d4a2d;
  --accent2:   #4a7c3f;
  --gold:      #b8963e;
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(0,0,0,0.04);
  --r:         14px;
  --r2:        10px;
  --shadow:    0 2px 16px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── LAYOUT ── */
.shell { max-width: 520px; margin: 0 auto; padding: 0 0 80px; }

/* ── HEADER ── */
.hd { padding: 32px 20px 20px; }
.hd-greeting { font-size: 13px; color: var(--ink3); letter-spacing: 0.04em; margin-bottom: 4px; }
.hd-day { font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 300; line-height: 1; color: var(--ink); letter-spacing: -0.01em; }
.hd-meta { font-size: 12px; color: var(--ink3); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.hd-pill { background: var(--accent); color: white; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 100px; }

/* ── TABS ── */
.tabs { display: flex; gap: 0; margin: 0 20px 20px; background: var(--card); border-radius: var(--r2); padding: 4px; }
.tab { flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-align: center; border-radius: 7px; border: none; cursor: pointer; background: transparent; color: var(--ink3); transition: all 0.2s; }
.tab.active { background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(45,74,45,0.3); }

/* ── SECTION PADDING ── */
.section { padding: 0 20px; }

/* ── SESSION CARD (smart suggestion) ── */
.session-card { border-radius: var(--r); padding: 22px 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
.session-card.morning { background: linear-gradient(135deg, #4a7c3f 0%, #2d4a2d 100%); }
.session-card.night   { background: linear-gradient(135deg, #1e2d4a 0%, #0f1a2d 100%); }
.session-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.05); }
.sc-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
.sc-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; color: white; line-height: 1.1; margin-bottom: 4px; }
.sc-sub { font-size: 12px; color: rgba(255,255,255,0.65); margin-bottom: 18px; }
.sc-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.25); color: white; font-size: 13px; font-weight: 500; padding: 10px 18px; border-radius: 100px; cursor: pointer; transition: background 0.15s; font-family: 'DM Sans', sans-serif; }
.sc-btn:hover { background: rgba(255,255,255,0.25); }

/* ── OPTION CARDS ── */
.option-card { background: var(--card); border-radius: var(--r); padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid var(--border2); transition: all 0.15s; }
.option-card:hover { background: var(--card2); border-color: var(--border); }
.oc-text .oc-title { font-size: 14px; font-weight: 500; color: var(--ink); }
.oc-text .oc-sub   { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.oc-arrow { font-size: 18px; color: var(--ink3); }

/* ── ROUTINE VIEW ── */
.routine-header { margin-bottom: 16px; }
.rh-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--ink); letter-spacing: -0.01em; }
.rh-meta  { font-size: 12px; color: var(--ink3); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }

/* progress */
.prog-wrap { height: 3px; background: var(--border); border-radius: 100px; margin-bottom: 18px; overflow: hidden; }
.prog-fill  { height: 100%; background: var(--accent); border-radius: 100px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

/* product card */
.prod-card { background: var(--card); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border2); transition: opacity 0.2s, border-color 0.2s; }
.prod-card.done { opacity: 0.55; border-left: 3px solid var(--accent); }
.prod-card.done .prod-name { text-decoration: line-through; color: var(--ink3); }

.prod-main { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; }
.prod-num { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--ink3); min-width: 22px; text-align: center; line-height: 1; }
.prod-card.done .prod-num { color: var(--accent); font-size: 18px; }
.prod-img { width: 54px; height: 54px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--bg2); border: 1px solid var(--border2); }
.prod-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.prod-info { flex: 1; min-width: 0; }
.prod-tag  { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 2px; }
.prod-name { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.2; }
.prod-brand { font-size: 11px; color: var(--ink3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.prod-actions { display: flex; border-top: 1px solid var(--border2); }
.prod-btn { flex: 1; padding: 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; background: none; border: none; cursor: pointer; color: var(--ink3); transition: background 0.15s; font-family: 'DM Sans', sans-serif; }
.prod-btn:hover { background: var(--bg2); }
.prod-btn.mark { border-left: 1px solid var(--border2); color: var(--accent); }
.prod-btn.marked { color: var(--ink3); }

/* how panel */
.how-panel { display: none; margin: 0 16px 14px; background: var(--bg2); border-radius: var(--r2); padding: 14px 16px; font-size: 13px; line-height: 1.65; color: var(--ink2); }
.how-panel.open { display: block; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.how-head { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 8px; }
.why-strip { margin-top: 10px; padding: 10px 12px; background: var(--card); border-radius: 8px; border-left: 2px solid var(--accent); font-size: 12px; color: var(--ink2); line-height: 1.6; }
.why-strip b { font-weight: 600; color: var(--accent); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 3px; }

/* complete */
.done-banner { background: var(--accent); color: white; border-radius: var(--r); padding: 20px; text-align: center; margin-top: 14px; }
.done-banner .db-em { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; display: block; margin-bottom: 4px; }
.done-banner .db-sub { font-size: 12px; opacity: 0.75; }

.back-btn { background: none; border: none; font-size: 13px; color: var(--ink3); cursor: pointer; padding: 14px 0 0; display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; }
.back-btn:hover { color: var(--ink); }

/* ── WEEK VIEW ── */
.week-pills { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.week-pills::-webkit-scrollbar { display: none; }
.wpill { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--ink3); transition: all 0.2s; position: relative; font-family: 'DM Sans', sans-serif; }
.wpill.active { background: var(--accent); color: white; box-shadow: 0 2px 10px rgba(45,74,45,0.3); }
.wpill.today::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.wpill:not(.active):hover { background: var(--card2); }

.wd-day-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; color: var(--ink); margin-bottom: 2px; display: flex; align-items: baseline; gap: 10px; }
.wd-today-tag { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); background: rgba(45,74,45,0.1); padding: 2px 8px; border-radius: 100px; }

.wd-block { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 12px; }
.wd-block-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border2); }
.wd-block-icon { font-size: 15px; }
.wd-block-name { font-size: 13px; font-weight: 600; color: var(--ink); flex: 1; }
.wd-block-sub  { font-size: 11px; color: var(--ink3); }
.wd-prod { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border2); }
.wd-prod:last-of-type { border-bottom: none; }
.wd-num { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; color: var(--ink3); width: 18px; text-align: center; flex-shrink: 0; }
.wd-thumb { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--bg2); flex-shrink: 0; border: 1px solid var(--border2); }
.wd-thumb img { width: 100%; height: 100%; object-fit: cover; }
.wd-pname { font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.2; }
.wd-pbrand { font-size: 11px; color: var(--ink3); }
.wd-go-btn { width: 100%; margin-top: 12px; padding: 11px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent); background: rgba(45,74,45,0.08); border: none; border-radius: var(--r2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.wd-go-btn:hover { background: rgba(45,74,45,0.15); }

/* ── SKIN VIEW ── */
.skin-score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.ss-card { background: var(--card); border-radius: var(--r2); padding: 14px; }
.ss-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
.ss-val { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; line-height: 1; }
.ss-val.bad { color: #c0392b; }
.ss-val.warn { color: #e67e22; }
.ss-val.ok  { color: var(--accent); }
.ss-sub { font-size: 11px; color: var(--ink3); margin-top: 3px; }

.skin-bar-row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border2); gap: 10px; }
.skin-bar-row:last-child { border-bottom: none; }
.sbr-label { font-size: 12px; color: var(--ink2); min-width: 105px; }
.sbr-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 100px; overflow: hidden; }
.sbr-fill { height: 100%; border-radius: 100px; }
.sbr-red    { background: #c0392b; }
.sbr-orange { background: #e67e22; }
.sbr-green  { background: var(--accent); }
.sbr-val { font-size: 11px; color: var(--ink3); min-width: 55px; text-align: right; }

/* ── RULES VIEW ── */
.rule-card { background: var(--card); border-radius: var(--r); padding: 16px 18px; margin-bottom: 10px; }
.rule-card .rc-icon { font-size: 20px; margin-bottom: 8px; display: block; }
.rule-card .rc-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
.rule-card .rc-text  { font-size: 13px; color: var(--ink2); line-height: 1.65; }

/* ── HISTORY VIEW ── */
.hist-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border2); }
.hist-row:last-child { border-bottom: none; }
.hist-date { font-size: 13px; color: var(--ink); }
.hist-label { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ── SECTION TITLE ── */
.sec-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; color: var(--ink); margin-bottom: 14px; }
.info-block { background: var(--card); border-radius: var(--r); padding: 16px 18px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="hd">
    <div class="hd-greeting" id="hd-greeting"></div>
    <div class="hd-day" id="hd-day"></div>
    <div class="hd-meta" id="hd-meta"></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('now',this)">NOW</button>
    <button class="tab" onclick="switchTab('week',this)">SEMANA</button>
    <button class="tab" onclick="switchTab('skin',this)">MI PIEL</button>
    <button class="tab" onclick="switchTab('rules',this)">REGLAS</button>
    <button class="tab" onclick="switchTab('hist',this)">LOG</button>
  </div>

  <div id="tab-now" class="section"></div>
  <div id="tab-week" class="section" style="display:none"></div>
  <div id="tab-skin" class="section" style="display:none"></div>
  <div id="tab-rules" class="section" style="display:none"></div>
  <div id="tab-hist" class="section" style="display:none"></div>

</div>

const DAYS_ES  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DAYS_SHT = ['D','L','M','X','J','V','S'];
const now    = new Date();
const hour   = now.getHours();
const dayIdx = now.getDay();
const timeStr = String(hour).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
const isMorning = hour >= 5 && hour < 14;
// L=1,X=3,V=5 → Avène Comedomed | D=0 → exfoliante
const isAveneDay = [1,3,5].includes(dayIdx);
const isExfoDay  = dayIdx === 0;
// X=3,V=5 → rutina mañana activa (Centella en vez de Glow Serum)
const isMorningActive = [3,5].includes(dayIdx);

// ── INIT HEADER ──────────────────────────────────────────────────────────────
document.getElementById('hd-greeting').textContent =
  hour < 12 ? 'Buenos días, Pol' : hour < 20 ? 'Buenas tardes, Pol' : 'Buenas noches, Pol';
document.getElementById('hd-day').textContent = DAYS_ES[dayIdx];

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = {screen:'home', routine:null, checked:{}, openHow:null};
let log   = [];
try { log   = JSON.parse(localStorage.getItem('sk_pol3_log') || '[]'); }   catch(e){}
try { const s = JSON.parse(localStorage.getItem('sk_pol3_'+now.toDateString())||'null'); if(s) state=s; } catch(e){}
function save() { try{localStorage.setItem('sk_pol3_'+now.toDateString(), JSON.stringify(state));}catch(e){} }

// ── RENDER ────────────────────────────────────────────────────────────────────
function goRoutine(rKey) {
  state.screen='routine'; state.routine=rKey; state.openHow=null;
  if(!state.checked[rKey]) state.checked[rKey]={};
  const label = rKey.startsWith('morning') ? 'Mañana' : 'Noche';
  const today = now.toLocaleDateString('es-ES');
  if(!log.find(l=>l.date===today&&l.r===rKey)){
    log.unshift({date:today,label,r:rKey});
    try{localStorage.setItem('sk_pol3_log',JSON.stringify(log.slice(0,60)));}catch(e){}
  }
  save(); renderNow();
}

function goHome() { state.screen='home'; state.openHow=null; save(); renderNow(); }

function toggleDone(rKey, id) {
  state.checked[rKey][id] = !state.checked[rKey][id];
  save(); renderNow();
}
function toggleHow(id) { state.openHow = state.openHow===id ? null : id; renderNow(); }

function renderNow() {
  const el = document.getElementById('tab-now');
  if(state.screen==='home') { el.innerHTML = homeHTML(); return; }
  if(state.screen==='routine') { el.innerHTML = routineHTML(state.routine); return; }
}

function homeHTML() {
  const mKey = morningKey();
  const nKey = nightKey();
  const mDone = state.checked[mKey] ? Object.values(state.checked[mKey]).filter(Boolean).length : 0;
  const nDone = state.checked[nKey] ? Object.values(state.checked[nKey]).filter(Boolean).length : 0;
  const mTotal = ROUTINES[mKey].length;
  const nTotal = ROUTINES[nKey].length;
  const mPct = Math.round(mDone/mTotal*100);
  const nPct = Math.round(nDone/nTotal*100);

  const mSubLabel = isMorningActive ? 'Centella anti-acné' : 'Glow Serum anti-manchas';
  const nSubLabel = isExfoDay ? 'Exfoliante poros' : isAveneDay ? 'Avène Comedomed' : 'Sensilis reparador';

  // Primary session based on time
  let primaryHTML = '';
  if(isMorning) {
    primaryHTML = `<div class="session-card morning">
      <div class="sc-label">☀️ &nbsp;AHORA · MAÑANA</div>
      <div class="sc-title">${isMorningActive ? 'Rutina Anti-Acné' : 'Rutina Anti-Manchas'}</div>
      <div class="sc-sub">${mSubLabel} · ${mTotal} pasos${mPct>0?' · '+mPct+'% completado':''}</div>
      <button class="sc-btn" onclick="goRoutine('${mKey}')"><span>${mPct===100?'✓ Completada':'Empezar →'}</span></button>
    </div>`;
  } else {
    primaryHTML = `<div class="session-card night">
      <div class="sc-label">🌙 &nbsp;AHORA · NOCHE</div>
      <div class="sc-title">${isExfoDay ? 'Noche Exfoliante' : isAveneDay ? 'Noche Avène' : 'Rutina de Noche'}</div>
      <div class="sc-sub">${nSubLabel} · ${nTotal} pasos${nPct>0?' · '+nPct+'% completado':''}</div>
      <button class="sc-btn" onclick="goRoutine('${nKey}')"><span>${nPct===100?'✓ Completada':'Empezar →'}</span></button>
    </div>`;
  }

  // Secondary session (the other one)
  const secKey   = isMorning ? nKey : mKey;
  const secLabel = isMorning ? 'Rutina de noche' : (isMorningActive?'Rutina Anti-Acné':'Rutina Anti-Manchas');
  const secSub   = isMorning ? nSubLabel : mSubLabel;
  const secDone  = isMorning ? nDone : mDone;
  const secTotal = isMorning ? nTotal : mTotal;

  return primaryHTML + `
  <div class="option-card" onclick="goRoutine('${secKey}')">
    <div class="oc-text">
      <div class="oc-title">${isMorning?'🌙':'☀️'} &nbsp;${secLabel}</div>
      <div class="oc-sub">${secSub} · ${secTotal} pasos${secDone>0?' · '+Math.round(secDone/secTotal*100)+'%':''}</div>
    </div>
    <span class="oc-arrow">›</span>
  </div>`;
}

function routineHTML(rKey) {
  const prods  = ROUTINES[rKey] || [];
  const checked = state.checked[rKey] || {};
  const done   = Object.values(checked).filter(Boolean).length;
  const total  = prods.length;
  const pct    = total ? Math.round(done/total*100) : 0;
  const titles = {
    morning_base:'Rutina Anti-Manchas', morning_active:'Rutina Anti-Acné',
    night_base:'Rutina de Noche', night_avene:'Noche · Avène', night_exfo:'Noche · Exfoliante'
  };
  const icons = { morning_base:'☀️', morning_active:'☀️', night_base:'🌙', night_avene:'🌙', night_exfo:'🌙' };

  let html = `<div class="routine-header">
    <div class="rh-title">${icons[rKey]} &nbsp;${titles[rKey]||'Rutina'}</div>
    <div class="rh-meta">${total} pasos · ${DAYS_ES[dayIdx]}</div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>`;

  prods.forEach((p,i) => {
    const isDone  = !!checked[p.id];
    const howOpen = state.openHow === p.id;
    html += `<div class="prod-card ${isDone?'done':''}">
      <div class="prod-main">
        <div class="prod-num">${isDone ? '✓' : i+1}</div>
        <div class="prod-img"><img src="${IMGS[p.img]||''}" alt="${p.name}"></div>
        <div class="prod-info">
          <div class="prod-tag">${p.tag}</div>
          <div class="prod-name">${p.name}</div>
          <div class="prod-brand">${p.brand}</div>
        </div>
      </div>
      ${howOpen ? `<div class="how-panel open">
        <div class="how-head">Cómo aplicar</div>
        <div>${p.how}</div>
        <div class="why-strip"><b>Por qué este paso</b>${p.why}</div>
      </div>` : ''}
      <div class="prod-actions">
        <button class="prod-btn" onclick="toggleHow('${p.id}')">${howOpen?'↑ Cerrar':'Cómo y por qué'}</button>
        <button class="prod-btn mark ${isDone?'marked':''}" onclick="toggleDone('${rKey}','${p.id}')">${isDone?'✓ Hecho':'Marcar done'}</button>
      </div>
    </div>`;
  });

  if(done===total && total>0) {
    html += `<div class="done-banner">
      <span class="db-em">Completada 🌿</span>
      <div class="db-sub">Tu piel lo agradecerá. Constancia = resultados.</div>
    </div>`;
  }
  html += `<button class="back-btn" onclick="goHome()">← Inicio</button>`;
  return html;
}

// ── WEEK ─────────────────────────────────────────────────────────────────────
function renderWeek() {
  const el = document.getElementById('tab-week');
  let pills = '<div class="week-pills">';
  WEEK.forEach((d,i)=>{
    const isToday = d.idx === dayIdx;
    pills += `<button class="wpill ${isToday?'active':''} ${isToday?'today':''}" onclick="pickDay(${i})" id="wp${i}">${d.s}</button>`;
  });
  pills += '</div><div id="wd-content"></div>';
  el.innerHTML = pills;
  const todayI = WEEK.findIndex(d=>d.idx===dayIdx);
  pickDay(todayI>=0?todayI:0);
}

function pickDay(i) {
  document.querySelectorAll('.wpill').forEach((p,j)=>p.classList.toggle('active',j===i));
  const d = WEEK[i];
  const isToday = d.idx === dayIdx;
  const mProds  = ROUTINES[d.mKey]||[];
  const nProds  = ROUTINES[d.nKey]||[];

  function prodRow(p,n){
    return `<div class="wd-prod">
      <div class="wd-num">${n}</div>
      <div class="wd-thumb"><img src="${IMGS[p.img]||''}" alt="${p.name}"></div>
      <div><div class="wd-pname">${p.name}</div><div class="wd-pbrand">${p.brand}</div></div>
    </div>`;
  }

  document.getElementById('wd-content').innerHTML = `
  <div class="wd-day-title">
    ${d.name}
    ${isToday?'<span class="wd-today-tag">HOY</span>':''}
  </div>

  <div class="wd-block">
    <div class="wd-block-hd">
      <span class="wd-block-icon">☀️</span>
      <span class="wd-block-name">Mañana · ${d.mLabel}</span>
      <span class="wd-block-sub">${mProds.length} pasos</span>
    </div>
    ${mProds.map((p,i)=>prodRow(p,i+1)).join('')}
    ${isToday?`<button class="wd-go-btn" onclick="goRoutine('${d.mKey}'); switchTab('now', document.querySelector('.tab'))">Hacer esta rutina →</button>`:''}
  </div>

  <div class="wd-block">
    <div class="wd-block-hd">
      <span class="wd-block-icon">🌙</span>
      <span class="wd-block-name">Noche · ${d.nLabel}</span>
      <span class="wd-block-sub">${nProds.length} pasos</span>
    </div>
    ${nProds.map((p,i)=>prodRow(p,i+1)).join('')}
    ${isToday?`<button class="wd-go-btn" onclick="goRoutine('${d.nKey}'); switchTab('now', document.querySelector('.tab'))">Hacer esta rutina →</button>`:''}
  </div>`;
}

  <div class="rule-card"><span class="rc-icon">⏰</span><div class="rc-title">8-12 semanas para ver resultados</div><div class="rc-text">Las manchas y los poros mejoran despacio. No cambies productos a las 2 semanas. La constancia con 3-4 pasos cada día supera cualquier rutina compleja que no se haga.</div></div>`;
}

// ── LOG ────────────────────────────────────────────────────────────────────────
function renderLog() {
  const el = document.getElementById('tab-hist');
  if(!log.length){
    el.innerHTML='<p class="sec-title">Log</p><div class="info-block" style="color:var(--ink3);font-size:13px">Sin historial todavía. Completa tu primera rutina.</div>';
    return;
  }
  let html='<p class="sec-title">Log</p><div class="info-block">';
  log.slice(0,25).forEach(l=>{
    html+=`<div class="hist-row">
      <div><div class="hist-date">${l.label}</div><div class="hist-label">${l.date}</div></div>
      <div class="hist-dot"></div>
    </div>`;
  });
  html+='</div>';
  el.innerHTML=html;
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelector('.tab').classList.add('active');
  ['now','week','skin','rules','hist'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'block':'none';
  });
  if(tab==='week')  renderWeek();
  if(tab==='skin')  renderSkin();
  if(tab==='rules') renderRules();
  if(tab==='hist')  renderLog();
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
renderNow();
</script>
</body>
</html>
